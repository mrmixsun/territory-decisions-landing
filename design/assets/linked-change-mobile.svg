<svg xmlns="http://www.w3.org/2000/svg" width="360" height="826" viewBox="0 0 360 826" role="img" aria-labelledby="title desc">
  <title id="title">Изменение участка и инфраструктурные связи</title>
  <desc id="desc">Условный проект изменения участка связан с транспортом, инженерными сетями и социальной инфраструктурой. Ниже перечислены вопросы о действующих и проектных решениях, недостающих данных и затронутых участниках.</desc>
  <rect width="360" height="826" rx="18" fill="#FFFFFF" stroke="#DCDDDC"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="32" font-size="13" font-weight="700" letter-spacing=".8" fill="#62656B">УСЛОВНАЯ СИТУАЦИЯ</text>
    <text x="20" y="59" font-size="20" font-weight="700" fill="#202228">Изменение участка</text>
    <g id="territory-map" transform="translate(20 78)">
      <rect width="320" height="342" rx="10" fill="#F7F6F2"/>
      <g fill="#EDECE8" stroke="#C8CAC7" stroke-width="1"><path d="M12 14H152V139H12Z M166 14H308V139H166Z M12 153H152V328H12Z M166 153H308V328H166Z"/></g>
      <path d="M159 0V342M0 146H320" stroke="#FFFFFF" stroke-width="12"/>
      <path d="M178 172H295V312H178Z" fill="#EADFE7" stroke="#6E405F" stroke-width="2"/>
      <path d="M187 182H286V302H187Z" fill="none" stroke="#6E405F" stroke-width="1.5" stroke-dasharray="5 5"/>
      <path d="M237 172V146H82V47" fill="none" stroke="#6E405F" stroke-width="2"/><circle cx="82" cy="47" r="3" fill="#6E405F"/>
      <path d="M178 237H68V269" fill="none" stroke="#6E405F" stroke-width="2" stroke-dasharray="6 4"/><circle cx="68" cy="269" r="3" fill="#6E405F"/>
      <path d="M237 172V82H270" fill="none" stroke="#6E405F" stroke-width="2"/><circle cx="270" cy="82" r="3" fill="#6E405F"/>
      <g font-size="14" font-weight="700" fill="#40434A"><text x="25" y="36">транспорт</text><text x="18" y="290">инженерные</text><text x="18" y="307">сети</text><text x="210" y="58">социальная</text><text x="210" y="75">инфраструктура</text></g>
      <text x="192" y="244" font-size="14" font-weight="700" fill="#6E405F">участок</text>
      <text x="192" y="263" font-size="13" fill="#40434A">проект</text>
    </g>
    <text x="20" y="449" font-size="18" font-weight="700" fill="#202228">Что требуется проверить?</text>
    <g id="questions" font-size="14" fill="#202228">
      <rect x="20" y="470" width="320" height="62" rx="8" fill="#F7F6F2" stroke="#DCDDDC"/>
      <rect x="20" y="542" width="320" height="62" rx="8" fill="#F7F6F2" stroke="#DCDDDC"/>
      <rect x="20" y="614" width="320" height="62" rx="8" fill="#F7F6F2" stroke="#DCDDDC"/>
      <rect x="20" y="686" width="320" height="62" rx="8" fill="#F7F6F2" stroke="#DCDDDC"/>
      <text x="34" y="496" font-size="13" font-weight="700" letter-spacing=".6" fill="#6E405F">ДЕЙСТВУЕТ</text><text x="34" y="517">Что уже действует?</text>
      <text x="34" y="568" font-size="13" font-weight="700" letter-spacing=".6" fill="#6E405F">ПРЕДЛАГАЕТСЯ</text><text x="34" y="589">Что только предлагается?</text>
      <text x="34" y="640" font-size="13" font-weight="700" letter-spacing=".6" fill="#6E405F">НЕ ХВАТАЕТ ДАННЫХ</text><text x="34" y="661">Каких данных не хватает?</text>
      <text x="34" y="712" font-size="13" font-weight="700" letter-spacing=".6" fill="#6E405F">ЗАТРАГИВАЕТ</text><text x="34" y="733">Кого затрагивает изменение?</text>
    </g>
    <text x="20" y="781" font-size="12" fill="#62656B">Решения проходят свои процедуры.</text>
  </g>
</svg>
