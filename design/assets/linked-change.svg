<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">Изменение участка связано с тремя видами инфраструктуры</title>
  <desc id="desc">Условный проект изменения параметров застройки участка связан с транспортом, инженерными сетями и социальной инфраструктурой. Для каждого направления важно различать действующие сведения, проекты и недостаток данных; связанные решения проходят свои процедуры.</desc>
  <rect width="1240" height="600" rx="22" fill="#FFFFFF" stroke="#DCDDDC"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="30" y="53" font-size="12" font-weight="700" letter-spacing="1.4" fill="#62656B">УСЛОВНАЯ СИТУАЦИЯ · ИЗМЕНЕНИЕ ПАРАМЕТРОВ ЗАСТРОЙКИ</text>
    <g id="territory-map" transform="translate(30 78)">
      <rect width="565" height="475" rx="14" fill="#F7F6F2"/>
      <g id="parcels" fill="#EDECE8" stroke="#C8CAC7" stroke-width="1.5"><path d="M24 24H246V176H24Z M270 24H541V176H270Z M24 202H246V446H24Z M270 202H541V446H270Z"/></g>
      <path d="M258 0V475M0 189H565" stroke="#FFFFFF" stroke-width="22"/>
      <path d="M296 221H510V422H296Z" fill="#EADFE7" stroke="#6E405F" stroke-width="2.5"/>
      <path d="M317 242H489V401H317Z" fill="none" stroke="#6E405F" stroke-width="2" stroke-dasharray="7 6"/>
      <g id="transport" fill="none" stroke="#6E405F" stroke-width="2.5"><path d="M403 220V190H170V85"/><circle cx="170" cy="85" r="5" fill="#6E405F"/></g>
      <g id="utilities" fill="none" stroke="#6E405F" stroke-width="2.5" stroke-dasharray="7 5"><path d="M295 332H112V380"/><circle cx="112" cy="380" r="5" fill="#6E405F" stroke="none"/></g>
      <g id="social" fill="none" stroke="#6E405F" stroke-width="2.5"><path d="M403 220V116H453"/><circle cx="453" cy="116" r="5" fill="#6E405F"/></g>
      <g fill="#202228" font-size="13" font-weight="700"><text x="65" y="69">транспорт</text><text x="39" y="409">инженерные сети</text><text x="385" y="91">социальная</text><text x="385" y="109">инфраструктура</text></g>
      <text x="320" y="323" fill="#6E405F" font-size="17" font-weight="700">участок</text>
      <text x="320" y="348" fill="#40434A" font-size="13">проектное изменение</text>
    </g>
    <g id="questions" transform="translate(630 78)">
      <text x="0" y="10" font-size="27" font-weight="700" fill="#202228">Проверить связанные последствия</text>
      <text x="0" y="38" font-size="15" fill="#62656B">до подготовки необходимых решений</text>
      <g id="question-cards">
        <rect x="0" y="61" width="580" height="78" rx="10" fill="#F7F6F2" stroke="#DCDDDC"/>
        <rect x="0" y="150" width="580" height="78" rx="10" fill="#F7F6F2" stroke="#DCDDDC"/>
        <rect x="0" y="239" width="580" height="78" rx="10" fill="#F7F6F2" stroke="#DCDDDC"/>
        <rect x="0" y="328" width="580" height="78" rx="10" fill="#F7F6F2" stroke="#DCDDDC"/>
      </g>
      <g font-size="13" font-weight="700" fill="#6E405F"><text x="18" y="87">01 · ДЕЙСТВУЕТ</text><text x="18" y="176">02 · ПРЕДЛАГАЕТСЯ</text><text x="18" y="265">03 · НЕ ХВАТАЕТ ДАННЫХ</text><text x="18" y="354">04 · ЗАТРАГИВАЕТ</text></g>
      <g font-size="18" fill="#202228"><text x="18" y="119">Что уже действует?</text><text x="18" y="208">Что только предлагается?</text><text x="18" y="297">Каких данных не хватает?</text><text x="18" y="386">Кого затрагивает изменение?</text></g>
      <text x="0" y="443" font-size="13" fill="#62656B">Связанные решения проходят собственные процедуры.</text>
    </g>
  </g>
</svg>
