<svg xmlns="http://www.w3.org/2000/svg" width="390" height="610" viewBox="0 0 390 610" role="img" aria-labelledby="title desc">
  <title id="title">Последствия разрыва</title><desc id="desc">Повторный сбор, ручная сверка, риск расхождения и поздняя переделка.</desc><rect width="390" height="610" rx="16" fill="#F8F5F1"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="31" fill="#4D7D8F" font-size="10" font-weight="700" letter-spacing=".9">КАК РАЗРЫВ ПРОЯВЛЯЕТСЯ В РАБОТЕ</text>
    <g fill="#fff" stroke="#D6E2E0"><rect x="24" y="55" width="342" height="103" rx="10"/><rect x="24" y="174" width="342" height="103" rx="10"/><rect x="24" y="293" width="342" height="103" rx="10"/><rect x="24" y="412" width="342" height="103" rx="10"/></g>
    <g font-size="14" font-weight="700"><text x="47" y="91" fill="#2B6073">Повторный сбор исходных сведений</text><text x="47" y="210" fill="#2B6073">Ручная сверка документов и данных</text><text x="47" y="329" fill="#8D5644">Риск расхождения акта и версии</text><text x="47" y="448" fill="#8D5644">Поздний конфликт и переделка</text></g>
    <g fill="#6A8088" font-size="11"><text x="47" y="120">У участников оказываются разные наборы</text><text x="47" y="239">Проверки и сопоставление повторяются</text><text x="47" y="358">Тождество содержания неочевидно</text><text x="47" y="477">Противоречие видно после важных решений</text></g>
    <path d="M195 159v14M195 278v14M195 397v14" stroke="#B36E52" stroke-width="2" stroke-dasharray="4 4"/><rect x="24" y="539" width="342" height="48" rx="8" fill="#EEEAE5"/><text x="195" y="560" text-anchor="middle" fill="#637880" font-size="10">Масштаб и стоимость последствий</text><text x="195" y="576" text-anchor="middle" fill="#637880" font-size="10">нужно измерять на конкретных процессах</text>
  </g>
</svg>
