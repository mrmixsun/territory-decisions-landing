<svg xmlns="http://www.w3.org/2000/svg" width="390" height="610" viewBox="0 0 390 610" role="img" aria-labelledby="title desc">
 <title id="title">Последствия разрыва</title><desc id="desc">Четыре группы последствий разрыва цифрового жизненного цикла.</desc><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#E8EDF5"/></pattern></defs><rect width="390" height="610" rx="18" fill="#F8FAFC"/><rect width="390" height="610" rx="18" fill="url(#g)"/><g font-family="Arial,sans-serif"><text x="24" y="32" fill="#2563EB" font-size="11" font-weight="700" letter-spacing="1.1">ОДИН РАЗРЫВ — ЧЕТЫРЕ ПОСЛЕДСТВИЯ</text>
 <g fill="#FFF" stroke="#CBD5E1"><rect x="24" y="50" width="342" height="101" rx="11"/><rect x="24" y="165" width="342" height="101" rx="11"/><rect x="24" y="280" width="342" height="101" rx="11"/><rect x="24" y="395" width="342" height="101" rx="11"/></g><g fill="#DBEAFE"><circle cx="54" cy="80" r="15"/><circle cx="54" cy="195" r="15"/><circle cx="54" cy="310" r="15"/><circle cx="54" cy="425" r="15"/></g><g fill="#2563EB" font-size="11" font-weight="700" text-anchor="middle"><text x="54" y="84">01</text><text x="54" y="199">02</text><text x="54" y="314">03</text><text x="54" y="429">04</text></g>
 <g fill="#111827" font-size="14" font-weight="700"><text x="82" y="76">Повторный сбор сведений</text><text x="82" y="191">Ручная сверка версий</text><text x="82" y="306">Расхождение акта и данных</text><text x="82" y="421">Поздние конфликты и переделки</text></g><g fill="#64748B" font-size="11"><text x="44" y="108">Участники снова запрашивают то,</text><text x="44" y="124">что уже собиралось для решения.</text><text x="44" y="223">Связи между документами и данными</text><text x="44" y="239">восстанавливают вручную.</text><text x="44" y="338">Трудно быстро подтвердить, какая</text><text x="44" y="354">именно версия была утверждена.</text><text x="44" y="453">Проблема обнаруживается, когда</text><text x="44" y="469">изменения уже стоят дорого.</text></g>
 <rect x="24" y="520" width="342" height="66" rx="11" fill="#0F172A"/><circle cx="47" cy="542" r="7" fill="#F97316"/><text x="63" y="546" fill="#FFF" font-size="12" font-weight="700">Причина у последствий одна:</text><text x="44" y="569" fill="#CBD5E1" font-size="11">несвязанные представления решения.</text></g></svg>
