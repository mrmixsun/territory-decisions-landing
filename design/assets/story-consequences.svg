<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Последствия разрыва жизненного цикла решения</title>
  <desc id="desc">Разрыв версии связан с четырьмя последствиями: повторным сбором исходных сведений, ручной сверкой документов и данных, риском расхождения акта и рабочей версии, поздним обнаружением конфликтов и переделкой.</desc>
  <rect width="760" height="460" rx="18" fill="#F8F5F1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="39" fill="#4D7D8F" font-size="12" font-weight="700" letter-spacing="1.4">КАК РАЗРЫВ ПРОЯВЛЯЕТСЯ В РАБОТЕ</text>

    <g stroke="#D6E2E0" fill="#FFFFFF">
      <rect x="34" y="69" width="278" height="132" rx="12"/>
      <rect x="448" y="69" width="278" height="132" rx="12"/>
      <rect x="34" y="257" width="278" height="132" rx="12"/>
      <rect x="448" y="257" width="278" height="132" rx="12"/>
    </g>
    <g fill="#DCEBED">
      <circle cx="76" cy="111" r="21"/><circle cx="490" cy="111" r="21"/>
    </g>
    <g fill="#F1DED6">
      <circle cx="76" cy="299" r="21"/><circle cx="490" cy="299" r="21"/>
    </g>
    <g fill="#2B6073" font-size="17" font-weight="700">
      <text x="110" y="108">Повторный сбор</text><text x="110" y="132">исходных сведений</text>
      <text x="524" y="108">Ручная сверка</text><text x="524" y="132">документов и данных</text>
    </g>
    <g fill="#8D5644" font-size="17" font-weight="700">
      <text x="110" y="296">Риск расхождения</text><text x="110" y="320">акта и рабочей версии</text>
      <text x="524" y="296">Поздний конфликт</text><text x="524" y="320">и переделка</text>
    </g>
    <g fill="#6A8088" font-size="12">
      <text x="56" y="175">У участников оказываются разные наборы</text>
      <text x="470" y="175">Проверки и сопоставление повторяются</text>
      <text x="56" y="363">Нельзя сразу доказать тождество содержания</text>
      <text x="470" y="363">Противоречие видно после важных решений</text>
    </g>
    <g fill="none" stroke="#A9BEc2" stroke-width="2">
      <path d="M313 135h45M402 135h45M313 323h45M402 323h45M380 202v54"/>
    </g>
    <g transform="translate(336 178)">
      <circle cx="44" cy="52" r="48" fill="#FFFFFF" stroke="#B36E52" stroke-width="2"/>
      <path d="M18 52h21l10-10 12 20 10-10h17" fill="none" stroke="#B36E52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="120" text-anchor="middle" fill="#A15E48" font-size="11" font-weight="700" letter-spacing="1">РАЗРЫВ ВЕРСИИ</text>
    </g>
    <rect x="34" y="411" width="692" height="30" rx="6" fill="#EEEAE5"/>
    <text x="380" y="431" text-anchor="middle" fill="#637880" font-size="11">Показан причинный механизм; масштаб и стоимость последствий требуют измерения.</text>
  </g>
</svg>
