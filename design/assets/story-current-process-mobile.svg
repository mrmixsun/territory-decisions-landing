<svg xmlns="http://www.w3.org/2000/svg" width="390" height="610" viewBox="0 0 390 610" role="img" aria-labelledby="title desc">
  <title id="title">Жизненный цикл решения сейчас</title><desc id="desc">Решение проходит от исходных сведений через рабочие инструменты, документы и акт, затем вручную переносится в разные системы и снова выгружается.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#6C8792" stroke-width="1.5"/></marker><marker id="w" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#B36E52" stroke-width="1.5"/></marker></defs>
  <rect width="390" height="610" rx="16" fill="#F7FAF8"/>
  <g font-family="Arial,Helvetica,sans-serif"><text x="24" y="31" fill="#4D7D8F" font-size="11" font-weight="700" letter-spacing="1">ПУТЬ ОДНОГО РЕШЕНИЯ</text>
    <g fill="#fff" stroke="#C8D8D8"><rect x="24" y="53" width="342" height="58" rx="9"/><rect x="24" y="137" width="342" height="58" rx="9"/><rect x="24" y="221" width="342" height="58" rx="9"/><rect x="24" y="305" width="342" height="58" rx="9"/></g>
    <g fill="#1D3442" font-size="14" font-weight="700"><text x="42" y="88">Исходные сведения</text><text x="42" y="172">Проект в рабочих инструментах</text><text x="42" y="256">Комплект документов</text><text x="42" y="340">Согласование, обсуждение и акт</text></g>
    <g fill="none" stroke="#6C8792" stroke-width="2" marker-end="url(#a)"><path d="M195 112v17"/><path d="M195 196v17"/><path d="M195 280v17"/></g>
    <path d="M195 365v31" fill="none" stroke="#B36E52" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#w)"/><text x="207" y="387" fill="#A15E48" font-size="11" font-weight="700">отдельный перенос</text>
    <g fill="#EEF4F3" stroke="#9DB8BF"><rect x="24" y="411" width="104" height="62" rx="8"/><rect x="143" y="411" width="104" height="62" rx="8"/><rect x="262" y="411" width="104" height="62" rx="8"/></g>
    <g fill="#2B596A" font-size="12" font-weight="700"><text x="46" y="439">Система A</text><text x="165" y="439">Система B</text><text x="285" y="439">Реестр</text></g><g fill="#6A8088" font-size="10"><text x="47" y="458">своя копия</text><text x="166" y="458">своя копия</text><text x="282" y="458">свои поля</text></g>
    <g fill="none" stroke="#B36E52" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#w)"><path d="M76 475v29"/><path d="M195 475v29"/><path d="M314 475v29"/></g>
    <rect x="24" y="519" width="342" height="67" rx="9" fill="#fff" stroke="#D8E3E1"/><text x="42" y="543" fill="#71878F" font-size="9" font-weight="700" letter-spacing="1">СЛЕДУЮЩАЯ ЗАДАЧА</text><text x="42" y="568" fill="#1D3442" font-size="13" font-weight="700">Документы или локальная выгрузка</text>
  </g>
