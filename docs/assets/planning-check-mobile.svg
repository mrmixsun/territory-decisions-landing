<svg xmlns="http://www.w3.org/2000/svg" width="360" height="765" viewBox="0 0 360 765" role="img" aria-labelledby="title desc">
  <title id="title">Условная ранняя проверка проекта планировки</title>
  <desc id="desc">Проектный участок сопоставлен с действующими сведениями. Замечание содержит объект, правило, версию источника и статус «требуется проверка человеком».</desc>
  <rect width="360" height="765" rx="18" fill="#FFFFFF" stroke="#DCDDDC"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="34" font-size="12" font-weight="700" letter-spacing=".7" fill="#62656B">УСЛОВНЫЙ ФРАГМЕНТ ТЕРРИТОРИИ</text>
    <g id="map" transform="translate(20 51)">
      <rect width="320" height="296" rx="10" fill="#F7F6F2"/>
      <g fill="#F0F0EC" stroke="#C8CAC7" stroke-width="1.3"><path d="M13 15H99V100H13Z M113 15H207V100H113Z M221 15H307V100H221Z M13 117H99V281H13Z M113 117H207V281H113Z M221 117H307V281H221Z"/></g>
      <path d="M106 0V296M0 108H320M214 0V296" fill="none" stroke="#FFFFFF" stroke-width="12"/>
      <path d="M121 125H199V273H121Z" fill="#EADFE7" stroke="#6E405F" stroke-width="2"/>
      <path d="M129 136H191V261H129Z" fill="none" stroke="#6E405F" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M11 197H309" stroke="#5F6266" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="160" cy="197" r="17" fill="#FFFFFF" stroke="#6E405F" stroke-width="2"/>
      <path d="M160 187v12m0 5v2" stroke="#6E405F" stroke-width="2.5" stroke-linecap="round"/>
      <text x="16" y="181" font-size="14" fill="#40434A">действующие сведения</text>
      <text x="121" y="292" font-size="14" font-weight="700" fill="#6E405F">проектный участок</text>
    </g>
    <text x="20" y="373" font-size="12" fill="#62656B">Пересечение линий не доказывает нарушение.</text>
    <path d="M20 398H340" stroke="#DCDDDC"/>
    <text x="20" y="428" font-size="13" font-weight="700" letter-spacing=".8" fill="#6E405F">ПРОВЕРЯЕМОЕ ЗАМЕЧАНИЕ</text>
    <text x="20" y="461" font-size="23" font-weight="700" fill="#202228">Что нужно уточнить</text>
    <g font-size="13" font-weight="700" fill="#85878B" letter-spacing=".8"><text x="20" y="495">ОБЪЕКТ</text><text x="20" y="550">ОСНОВАНИЕ</text><text x="20" y="605">ИСТОЧНИК</text><text x="20" y="660">СТАТУС</text></g>
    <g font-size="15" fill="#202228"><text x="20" y="516">проектный участок</text><text x="20" y="571">применимое правило</text><text x="20" y="626">действующая версия сведений</text><text x="20" y="681">требуется проверка человеком</text></g>
    <path d="M20 528H340M20 583H340M20 638H340M20 694H340" stroke="#DCDDDC"/>
    <text x="20" y="730" font-size="12" fill="#62656B">После доработки — повторная проверка.</text>
  </g>
</svg>
