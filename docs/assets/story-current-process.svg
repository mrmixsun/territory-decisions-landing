<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Жизненный цикл градостроительного решения сейчас</title>
  <desc id="desc">Исходные сведения переходят в рабочие инструменты и комплект документов. После согласования и принятия акта содержание вручную переносится в несколько информационных систем и снова выгружается для следующих задач.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#6C8792" stroke-width="1.5"/></marker>
    <marker id="arrowWarm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#B36E52" stroke-width="1.5"/></marker>
  </defs>
  <rect width="760" height="460" rx="18" fill="#F7FAF8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="39" fill="#4D7D8F" font-size="12" font-weight="700" letter-spacing="1.4">ПУТЬ ОДНОГО РЕШЕНИЯ</text>

    <g fill="#FFFFFF" stroke="#C8D8D8">
      <rect x="34" y="68" width="155" height="90" rx="10"/>
      <rect x="218" y="68" width="155" height="90" rx="10"/>
      <rect x="402" y="68" width="155" height="90" rx="10"/>
      <rect x="586" y="68" width="140" height="90" rx="10"/>
    </g>
    <g fill="#1D3442" font-size="16" font-weight="700">
      <text x="52" y="105">Исходные</text><text x="52" y="127">сведения</text>
      <text x="236" y="105">Рабочие</text><text x="236" y="127">инструменты</text>
      <text x="420" y="105">Комплект</text><text x="420" y="127">документов</text>
      <text x="604" y="105">Процедуры</text><text x="604" y="127">и акт</text>
    </g>
    <g fill="none" stroke="#6C8792" stroke-width="2" marker-end="url(#arrow)">
      <path d="M190 113h20"/><path d="M374 113h20"/><path d="M558 113h20"/>
    </g>

    <path d="M656 167v49" fill="none" stroke="#B36E52" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowWarm)"/>
    <text x="646" y="190" text-anchor="end" fill="#A15E48" font-size="12" font-weight="700">отдельный перенос</text>

    <g fill="#EEF4F3" stroke="#9DB8BF">
      <rect x="365" y="229" width="118" height="72" rx="9"/>
      <rect x="502" y="229" width="118" height="72" rx="9"/>
      <rect x="639" y="229" width="87" height="72" rx="9"/>
    </g>
    <g fill="#2B596A" font-size="14" font-weight="700">
      <text x="384" y="260">Система A</text><text x="521" y="260">Система B</text><text x="654" y="260">Реестр</text>
    </g>
    <g fill="#6A8088" font-size="11">
      <text x="384" y="281">своя копия</text><text x="521" y="281">своя копия</text><text x="654" y="281">свои поля</text>
    </g>
    <g fill="none" stroke="#B36E52" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrowWarm)">
      <path d="M656 215C604 211 520 211 452 226"/>
      <path d="M665 215C633 220 603 223 574 228"/>
      <path d="M680 215v9"/>
    </g>

    <rect x="34" y="344" width="692" height="78" rx="10" fill="#FFFFFF" stroke="#D8E3E1"/>
    <text x="54" y="372" fill="#71878F" font-size="11" font-weight="700" letter-spacing="1">СЛЕДУЮЩАЯ ЗАДАЧА</text>
    <text x="54" y="399" fill="#1D3442" font-size="16" font-weight="700">Документы или локальная выгрузка</text>
    <text x="357" y="399" fill="#A15E48" font-size="13">связи и актуальность приходится проверять заново</text>
    <g fill="none" stroke="#B36E52" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrowWarm)">
      <path d="M424 305v31"/><path d="M561 305v31"/><path d="M683 305v31"/>
    </g>
  </g>
</svg>
