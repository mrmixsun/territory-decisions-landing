<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Корневой дефект — разрыв цифрового жизненного цикла</title><desc id="desc">Документная версия решения и данные в системах расходятся из-за ручного переноса.</desc>
