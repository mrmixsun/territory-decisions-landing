<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Корневой дефект — разрыв связи между представлениями решения</title>
  <desc id="desc">В документном контуре согласуется версия A и принимается акт. В цифровом контуре появляются наборы A штрих и A два штриха. Ручные переносы, сверка и повторный ввод не гарантируют тождество версий.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#6C8792" stroke-width="1.5"/></marker>
    <marker id="arrowWarm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#B36E52" stroke-width="1.5"/></marker>
  </defs>
  <rect width="760" height="460" rx="18" fill="#F8F7F3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="39" fill="#4D7D8F" font-size="12" font-weight="700" letter-spacing="1.4">ОДНО РЕШЕНИЕ — НЕСКОЛЬКО ПРЕДСТАВЛЕНИЙ</text>

    <text x="34" y="91" fill="#6A8088" font-size="12" font-weight="700" letter-spacing="1">ДОКУМЕНТНЫЙ КОНТУР</text>
    <g fill="#FFFFFF" stroke="#C8D8D8">
      <rect x="211" y="64" width="128" height="58" rx="9"/>
      <rect x="386" y="64" width="152" height="58" rx="9"/>
      <rect x="585" y="64" width="141" height="58" rx="9"/>
    </g>
    <g fill="#1D3442" font-size="15" font-weight="700">
      <text x="238" y="99">Версия A</text><text x="408" y="99">Согласование</text><text x="631" y="99">Акт</text>
    </g>
    <g fill="none" stroke="#6C8792" stroke-width="2" marker-end="url(#arrow)"><path d="M340 93h37"/><path d="M539 93h37"/></g>

    <text x="34" y="367" fill="#6A8088" font-size="12" font-weight="700" letter-spacing="1">ЦИФРОВОЙ КОНТУР</text>
    <g fill="#EEF4F3" stroke="#9DB8BF">
      <rect x="211" y="338" width="128" height="58" rx="9"/>
      <rect x="386" y="338" width="152" height="58" rx="9"/>
      <rect x="585" y="338" width="141" height="58" rx="9"/>
    </g>
    <g fill="#2B596A" font-size="15" font-weight="700">
      <text x="232" y="373">Набор A′</text><text x="410" y="373">Обновление</text><text x="607" y="373">Набор A″</text>
    </g>
    <g fill="none" stroke="#6C8792" stroke-width="2" marker-end="url(#arrow)"><path d="M340 367h37"/><path d="M539 367h37"/></g>

    <path d="M275 132v73M275 255v73M462 132v73M462 255v73M655 132v73M655 255v73" fill="none" stroke="#B36E52" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowWarm)"/>
    <g fill="#A15E48" font-size="11" font-weight="700">
      <text x="288" y="167">повторный ввод</text><text x="475" y="167">ручная сверка</text><text x="668" y="167">выгрузка</text>
    </g>

    <g transform="translate(278 197)">
      <path d="M0 32h76l16-16 16 16h76" fill="none" stroke="#B36E52" stroke-width="3"/>
      <circle cx="92" cy="16" r="34" fill="#F4E5DF" stroke="#B36E52" stroke-width="2"/>
      <path d="M82 6l20 20m0-20L82 26" stroke="#B36E52" stroke-width="3" stroke-linecap="round"/>
      <text x="92" y="68" text-anchor="middle" fill="#A15E48" font-size="12" font-weight="700" letter-spacing="1">РАЗРЫВ ВЕРСИЙ</text>
    </g>
    <rect x="34" y="414" width="692" height="28" rx="6" fill="#F1E5DF"/>
    <text x="380" y="433" text-anchor="middle" fill="#8D5644" font-size="12" font-weight="700">Что рассматривали? Что утвердили? С какой версией работают сейчас?</text>
  </g>
</svg>
