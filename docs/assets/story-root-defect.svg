    <g font-size="12" font-weight="700" text-anchor="middle"><rect x="36" y="382" width="210" height="42" rx="9" fill="#0F172A"/><rect x="275" y="382" width="210" height="42" rx="9" fill="#0F172A"/><rect x="514" y="382" width="210" height="42" rx="9" fill="#0F172A"/><text x="141" y="408" fill="#FFF">Что рассматривали?</text><text x="380" y="408" fill="#FFF">Что утвердили?</text><text x="619" y="408" fill="#FFF">Что действует сейчас?</text></g>
