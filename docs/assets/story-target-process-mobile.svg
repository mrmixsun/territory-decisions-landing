<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="title desc">
  <title id="title">Связанный цифровой жизненный цикл</title><desc id="desc">Официальная редакция проходит процедуры и доработку, итоговая версия связывается с актом, затем применяется и изменяется.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#477889" stroke-width="1.5"/></marker></defs><rect width="390" height="650" rx="16" fill="#F4F9F8"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="31" fill="#4D7D8F" font-size="10" font-weight="700" letter-spacing=".8">СВЯЗАННЫЙ ЦИФРОВОЙ ЖИЗНЕННЫЙ ЦИКЛ</text>
    <g fill="#fff" stroke="#AFC7CB"><rect x="24" y="55" width="342" height="58" rx="9"/><rect x="24" y="139" width="342" height="58" rx="9"/><rect x="24" y="223" width="342" height="58" rx="9"/></g><rect x="24" y="307" width="342" height="58" rx="9" fill="#E1EEF0" stroke="#477889" stroke-width="2"/>
    <g fill="#1D3442" font-size="13" font-weight="700"><text x="42" y="90">Исходные версии</text><text x="42" y="174">Официальная проектная редакция</text><text x="42" y="258">Проверка, согласование, обсуждение</text><text x="42" y="342">Итоговая версия ↔ акт</text></g><g fill="none" stroke="#477889" stroke-width="2" marker-end="url(#a)"><path d="M195 114v17"/><path d="M195 198v17"/><path d="M195 282v17"/></g><path d="M340 271c35 0 35-100 0-100" fill="none" stroke="#477889" stroke-width="1.8" marker-end="url(#a)"/><text x="326" y="221" text-anchor="end" fill="#477889" font-size="10" font-weight="700">доработка</text>
    <g fill="#fff" stroke="#AFC7CB"><rect x="24" y="407" width="100" height="58" rx="8"/><rect x="145" y="407" width="100" height="58" rx="8"/><rect x="266" y="407" width="100" height="58" rx="8"/></g><g fill="#1D3442" font-size="11" font-weight="700"><text x="43" y="433">Начало</text><text x="43" y="450">действия</text><text x="166" y="442">Применение</text><text x="286" y="442">Изменение</text></g><g fill="none" stroke="#477889" stroke-width="2" marker-end="url(#a)"><path d="M124 436h12"/><path d="M246 436h12"/></g><path d="M195 366v33" fill="none" stroke="#477889" stroke-width="2" marker-end="url(#a)"/>
    <g><rect x="24" y="503" width="342" height="36" rx="7" fill="#DCECEF"/><rect x="24" y="547" width="342" height="36" rx="7" fill="#D5E7E5"/><rect x="24" y="591" width="342" height="36" rx="7" fill="#E8E5D8"/><g text-anchor="middle" font-size="10" font-weight="700"><text x="195" y="526" fill="#2B596A">СТРУКТУРИРОВАННЫЕ ДАННЫЕ И РЕЕСТРЫ</text><text x="195" y="570" fill="#2B596A">ЮРИДИЧЕСКИ ЗНАЧИМЫЕ ЦИФРОВЫЕ РЕШЕНИЯ</text><text x="195" y="614" fill="#6F694D">АНАЛИТИКА И МОДЕЛИРОВАНИЕ</text></g></g>
